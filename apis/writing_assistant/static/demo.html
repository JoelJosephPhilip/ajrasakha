<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Writing Assistant - Test Console</title>
<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: two-pane working tool - request form pinned on the left,
   result stream scrolls on the right; stacks to one column on phone.
   Palette: cool paper white + three hue-coded sections (grass green for
   structure, violet for polishing, amber/coral for guardrail/status) so
   the tool reads as several distinct checks, not one grey wall. */
:root{
  --bg:#f6f8f2; --surface:#ffffff; --surface-alt:#eff3e9; --border:#e0e6d6;
  --ink:#1b231d; --ink-dim:#69725f; --ink-faint:#9aa38c;
  --accent:#1f9d6d; --accent-ink:#ffffff; --accent-soft:#e1f5e9; --accent-line:#bfe6cf;
  --polish:#7c5cfc; --polish-soft:#efeafe; --polish-line:#d6cdfb;
  --warn:#d98c1f; --warn-soft:#fbf0dc; --warn-line:#f0d9a3;
  --danger:#e2534f; --danger-soft:#fbe7e6; --danger-line:#f3c2c0;
  --neutral:#6d7689; --neutral-soft:#eceef2; --neutral-line:#d7dae2;
  --display:'Fraunces',Georgia,serif; --sans:'Inter',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
  --shadow:0 1px 2px rgba(27,35,29,.04), 0 6px 20px -8px rgba(27,35,29,.12);
  padding-left: max(16px, env(safe-area-inset-left,0px));
  padding-right: max(16px, env(safe-area-inset-right,0px));
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0}
img{max-width:100%}
.wrap{max-width:1280px;margin:0 auto;padding:28px 16px 56px}

header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:12px}
.brand .mark{width:40px;height:40px;border-radius:11px;background:linear-gradient(145deg,var(--accent),#17c98d);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);flex:none}
.brand .mark svg{width:21px;height:21px}
.brand h1{font-family:var(--display);font-size:25px;font-weight:600;letter-spacing:-.01em;color:var(--ink)}
.brand .sub{font-size:12.5px;color:var(--ink-dim);margin-top:1px}

.conn{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-dim)}
.conn-pill{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:6px 12px 6px 10px;box-shadow:var(--shadow)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--neutral);flex:none}
.dot.ok{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.dot.bad{background:var(--danger);box-shadow:0 0 0 3px var(--danger-soft)}
.conn input{font-family:var(--mono);font-size:12px;background:transparent;border:none;color:var(--ink);width:160px;min-width:0;outline:none}
.conn input::placeholder{color:var(--ink-faint)}
.btn{font-family:var(--sans);font-size:13px;font-weight:600;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--ink);padding:7px 13px;cursor:pointer;white-space:nowrap;transition:transform .12s ease,box-shadow .12s ease}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--accent),#17b97f);border-color:transparent;color:var(--accent-ink);box-shadow:0 6px 18px -6px rgba(31,157,109,.55)}
.btn.primary:hover{color:var(--accent-ink);filter:brightness(1.04)}
.btn.primary:disabled{opacity:.6;cursor:not-allowed;box-shadow:none;transform:none}
.btn.sm{font-size:12px;padding:5px 10px;border-radius:7px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-dim);padding:4px 6px}
.btn.ghost:hover{color:var(--accent)}

.examples{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--ink);padding:7px 14px 7px 11px;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s ease,border-color .12s ease}
.chip:hover{transform:translateY(-1px)}
.chip .cdot{width:8px;height:8px;border-radius:50%;flex:none}
.chip[data-example="complete"] .cdot{background:var(--accent)}
.chip[data-example="complete"]:hover{border-color:var(--accent)}
.chip[data-example="partial"] .cdot{background:var(--warn)}
.chip[data-example="partial"]:hover{border-color:var(--warn)}
.chip[data-example="typo"] .cdot{background:var(--polish)}
.chip[data-example="typo"]:hover{border-color:var(--polish)}

.grid{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}

.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;min-width:0;box-shadow:var(--shadow)}
.card.accent-structure{border-top:3px solid var(--accent)}
.card.accent-polish{border-top:3px solid var(--polish)}
.panel-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.panel-title h2{font-family:var(--display);font-size:17px;font-weight:600;color:var(--ink)}
.panel-title h3{font-family:var(--sans);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-dim)}

.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--ink-dim);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.field input[type=text], .field textarea{
  width:100%;font-family:var(--sans);font-size:13.5px;color:var(--ink);
  background:var(--surface-alt);border:1px solid var(--border);border-radius:10px;padding:10px 12px;resize:vertical;
}
.field textarea{min-height:220px;line-height:1.55;font-family:var(--mono);font-size:12.5px}
.field input[type=text]:focus, .field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

details.opts{border:1px solid var(--border);border-radius:12px;background:var(--surface-alt);margin-bottom:14px;overflow:hidden}
details.opts summary{cursor:pointer;padding:10px 14px;font-size:12.5px;font-weight:700;color:var(--ink-dim);list-style:none;display:flex;align-items:center;gap:6px}
details.opts summary::-webkit-details-marker{display:none}
details.opts summary::before{content:"›";display:inline-block;color:var(--accent);font-size:16px;transition:transform .15s ease}
details.opts[open] summary::before{transform:rotate(90deg)}
.opts-body{padding:2px 14px 14px}

.toggle-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--border)}
.toggle-row:first-child{border-top:none}
.toggle-row input{margin:0;flex:none;width:17px;height:17px;accent-color:var(--polish)}
.toggle-row .tlabel{font-size:13px;font-weight:600;color:var(--ink)}

.steps-grid{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px}
@media (max-width:420px){.steps-grid{grid-template-columns:1fr}}
.step-chk{display:flex;align-items:center;gap:7px;font-size:12.5px;padding:4px 0;color:var(--ink)}
.step-chk input{margin:0;flex:none;width:15px;height:15px;accent-color:var(--accent)}

.submit-row{margin-top:6px}
.submit-row .btn.primary{width:100%;padding:13px 14px;font-size:14.5px;border-radius:11px}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:70px 20px;color:var(--ink-dim);border:1.5px dashed var(--border);border-radius:16px;background:var(--surface)}
.empty .picto{width:48px;height:48px;border-radius:14px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center}
.empty .picto svg{color:var(--accent)}
.empty p{margin:0;font-size:13.5px;max-width:320px}

/* Loading: an animated gradient bar plus rotating status lines, so a
   15-20s real request still feels alive instead of stalled. */
.loading-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px 24px;text-align:center;box-shadow:var(--shadow)}
.loading-bar{height:6px;border-radius:999px;background:var(--surface-alt);overflow:hidden;margin:0 auto 18px;max-width:320px;position:relative}
.loading-bar::after{content:"";position:absolute;inset:0;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--polish),var(--warn),var(--accent));background-size:300% 100%;animation:loadsweep 2.6s ease-in-out infinite, loadgrow 22s cubic-bezier(.1,.6,.2,1) forwards}
@keyframes loadsweep{0%{background-position:0% 0}100%{background-position:300% 0}}
@keyframes loadgrow{0%{transform:scaleX(0.02)}100%{transform:scaleX(.94)}}
.loading-bar{transform-origin:left}
.loading-card .stage{font-size:14px;font-weight:600;color:var(--ink);min-height:20px;transition:opacity .25s ease}
.loading-card .stage-sub{font-size:12px;color:var(--ink-faint);margin-top:4px}
@media (prefers-reduced-motion: reduce){.loading-bar::after{animation:none;transform:scaleX(.5)}}

.err-box{background:var(--danger-soft);border:1px solid var(--danger-line);color:#9c3a37;border-radius:12px;padding:14px 16px;font-size:13px}
.err-box strong{display:block;margin-bottom:4px;color:var(--danger)}
.err-box code{font-family:var(--mono);font-size:11.5px;word-break:break-all}

.results{display:flex;flex-direction:column;gap:16px;min-width:0}
.meta-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-dim);font-family:var(--mono)}
.meta-row .chip2{background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:4px 10px;box-shadow:var(--shadow)}

.badge{display:inline-flex;align-items:center;gap:5px;font-family:var(--sans);font-size:11.5px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;border-radius:999px;padding:5px 11px;border:1px solid transparent}
.badge.covered,.badge.complete,.badge.suggested,.badge.passed{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
.badge.partial{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
.badge.missing,.badge.incomplete,.badge.rejected,.badge.failed{background:var(--danger-soft);color:var(--danger);border-color:var(--danger-line)}
.badge.not_assessed,.badge.skipped,.badge.unavailable{background:var(--neutral-soft);color:var(--neutral);border-color:var(--neutral-line)}

table.steps{width:100%;border-collapse:collapse;font-size:12.5px}
table.steps th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);font-weight:700;padding:7px 8px;border-bottom:1.5px solid var(--border)}
table.steps td{padding:9px 8px;border-bottom:1px solid var(--border);vertical-align:top}
table.steps tr:last-child td{border-bottom:none}
table.steps tr:hover td{background:var(--surface-alt)}
table.steps td.step-name{font-weight:600;white-space:nowrap}
table.steps td.sl{color:var(--ink-faint);width:20px;font-family:var(--mono)}
.gap-note{font-size:11.5px;color:var(--ink-dim);margin-top:3px}
.order-warn{background:var(--warn-soft);color:#8a5e13;border:1px solid var(--warn-line);border-radius:10px;padding:9px 12px;font-size:12px;margin-top:10px}

.reason-box{background:var(--surface-alt);border:1px solid var(--border);border-radius:10px;padding:11px 13px;font-size:13px;color:var(--ink-dim);margin-bottom:12px}

.diff-card{border:1px solid var(--border);border-radius:11px;overflow:hidden;margin-bottom:9px;box-shadow:var(--shadow)}
.diff-row{padding:9px 12px;font-family:var(--mono);font-size:12px;line-height:1.55;word-break:break-word}
.diff-row.before{background:var(--danger-soft);color:#7a2b28}
.diff-row.after{background:var(--accent-soft);color:#14693f;border-top:1px solid var(--border)}
.diff-tag{display:inline-block;font-family:var(--sans);font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-right:7px;opacity:.75}

.tokens-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px;margin:12px 0}
.token-chip{display:flex;justify-content:space-between;gap:6px;font-size:11px;background:var(--surface-alt);border:1px solid var(--border);border-radius:8px;padding:6px 9px}
.token-chip .tname{color:var(--ink-dim)}
.token-chip .tval{font-family:var(--mono);font-weight:700}
.token-chip .tval.changed{color:var(--danger)}
.token-chip .tval.unchanged{color:var(--accent)}
.token-chip .tval.not_run{color:var(--danger)}

.details-list{margin:10px 0 0;padding-left:18px;font-size:12px;color:var(--ink-dim)}
.details-list li{margin-bottom:5px}
.disclaimer{font-size:11px;color:var(--ink-faint);font-style:italic;margin-top:12px}

.suggested-text{background:var(--surface-alt);border:1px solid var(--border);border-radius:10px;padding:13px;font-family:var(--mono);font-size:12.5px;white-space:pre-wrap;max-height:260px;overflow:auto;margin-top:8px}

pre.raw{background:var(--surface-alt);border:1px solid var(--border);border-radius:10px;padding:13px;font-family:var(--mono);font-size:11px;overflow:auto;max-height:420px;white-space:pre-wrap}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V10"/><path d="M12 10c0-4 3-7 7-7 0 4-3 7-7 7z"/><path d="M12 14c0-3-2.5-5-6-5 0 3 2.5 5 6 5z"/></svg></div>
      <div>
        <h1>Writing Assistant</h1>
        <div class="sub">/polish-draft test console</div>
      </div>
    </div>
    <div class="conn">
      <div class="conn-pill">
        <span id="connDot" class="dot"></span>
        <span id="connLabel">checking</span>
        <input id="baseUrl" type="text" placeholder="this server" spellcheck="false">
      </div>
      <button class="btn sm" id="checkBtn" type="button">Check</button>
    </div>
  </header>

  <div class="examples">
    <button class="chip" data-example="complete" type="button"><span class="cdot"></span>Complete draft</button>
    <button class="chip" data-example="partial" type="button"><span class="cdot"></span>Partial draft</button>
    <button class="chip" data-example="typo" type="button"><span class="cdot"></span>Needs polish</button>
  </div>

  <div class="grid">
    <!-- Request panel -->
    <div class="card">
      <div class="field">
        <label for="question">Question</label>
        <input id="question" type="text" value="How to control Blast Disease in paddy?">
      </div>

      <div class="field">
        <label for="draft">Draft answer</label>
        <textarea id="draft" spellcheck="false"></textarea>
      </div>

      <details class="opts" open>
        <summary>Skip steps</summary>
        <div class="opts-body">
          <div class="steps-grid" id="skipStepsGrid"></div>
        </div>
      </details>

      <details class="opts">
        <summary>Options</summary>
        <div class="opts-body">
          <div class="toggle-row">
            <input type="checkbox" id="skipStructural">
            <div class="tlabel">Skip structural validation</div>
          </div>
          <div class="toggle-row">
            <input type="checkbox" id="skipGuardrail">
            <div class="tlabel">Skip technical-content guardrail</div>
          </div>
          <div class="toggle-row">
            <input type="checkbox" id="skipPolish">
            <div class="tlabel">Skip language polishing</div>
          </div>
        </div>
      </details>

      <div class="submit-row">
        <button class="btn primary" id="submitBtn" type="button">Run /polish-draft</button>
      </div>
    </div>

    <!-- Results panel -->
    <div id="resultsPane">
      <div class="empty">
        <div class="picto"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg></div>
        <p>Run a request to see structural validation, polishing, and the guardrail's before/after diff.</p>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var FIXED_STEPS = [
    "Introduction",
    "Is this a major or minor problem",
    "Confirm the identification first",
    "Severity - impact if uncontrolled",
    "Decision point - when to move to chemical control",
    "Cultural control",
    "Biological control",
    "Chemical control (once threshold crossed)",
    "Safety and PHI",
    "Conclusion"
  ];

  var EXAMPLES = {
    complete: {
      question: "How to control Blast Disease in paddy?",
      draft: "Introduction\nRice Blast, caused by the fungus Magnaporthe oryzae (syn. Pyricularia oryzae), is one of the most destructive fungal diseases of paddy in India. It can affect leaves, nodes, necks and panicles at different crop growth stages. Effective management requires an Integrated Disease Management (IDM) approach combining cultural, biological and need-based chemical measures.\n\nIs This a Major or Minor Problem for Paddy\nRice Blast is a major and economically important disease of paddy. Severe infection can cause considerable yield losses, particularly when neck blast develops during heading and flowering.\n\nConfirm the Identification First\nLeaf blast appears as spindle-shaped or diamond-shaped lesions with grey or whitish centres and brown margins. Neck blast causes brown to black discoloration around the panicle neck.\n\nSeverity - What Happens if Uncontrolled\nIf left unmanaged, the disease can spread rapidly across the field, reducing photosynthetic area and interfering with nutrient movement to developing grains.\n\nDecision Point - When to Move to Chemical Control\nMonitor the crop regularly, especially during cloudy weather and high humidity. Protection is particularly important around booting and heading because neck blast can cause severe yield losses.\n\nCultural Control\nUse healthy, certified disease-free seeds and resistant or tolerant varieties. Maintain optimum spacing and avoid excessive nitrogen application.\n\nBiological Control\nSeed treatment with locally recommended Trichoderma-based formulations may help suppress seed- and soil-associated inoculum.\n\nChemical Control (Once Severity Crosses the Threshold)\nUse fungicides specifically registered and recommended for Rice Blast in paddy, following the current CIB&RC-registered label for dose, timing and application method.\n\nSafety and PHI\nWear gloves, a mask and protective clothing during fungicide application. Follow the product label's pre-harvest interval (PHI).\n\nConclusion\nEarly identification and timely management, combined with resistant varieties and a registered fungicide when needed, are essential to control Rice Blast in paddy."
    },
    partial: {
      question: "How to control Blast Disease in paddy?",
      draft: "Introduction\nRice Blast, caused by the fungus Magnaporthe oryzae, is one of the most destructive fungal diseases of paddy in India.\n\nConclusion\nEarly identification and timely management are essential to control Rice Blast in paddy."
    },
    typo: {
      question: "How to control Blast Disease in paddy?",
      draft: "Introduction\nRice Blast, caused by the fungus Magnaporthe oryzae, is one of the most destructive fungal diseases of paddy in India.\n\nIs This a Major or Minor Problem for Paddy\nRice Blast is a major and economically important disease of paddy. Severe infection can causes considerable yield losses.\n\nConfirm the Identification First\nLeaf blast appear as spindle-shaped or diamond-shaped lesions with grey or whitish centres and brown margins.\n\nSeverity - What Happens if Uncontrolled\nIf left unmanaged, the disease can spreads rapidly across the field.\n\nDecision Point - When to Move to Chemical Control\nMonitor the crop regularly. If leaf blast symptoms appear and continue spreading, consider appropriate control measures.\n\nCultural Control\nUse healthy, certified disease-free seeds and recommended resistant or tolerant rice varieties.\n\nBiological Control\nSeed treatment with locally recommended Trichoderma-based formulations may help suppress seed-associated inoculum.\n\nChemical Control (Once Severity Crosses the Threshold)\nUse fungicides specifically registered and recommended for Rice Blast in paddy at a dose of 2ml per litre of water.\n\nSafety and PHI\nWear gloves, a mask and protective clothing during fungicide application. Follow a pre-harvest interval (PHI) of 21 days.\n\nConclusion\nEarly identification and timely management is essential to control Rice Blast in paddy."
    }
  };

  var LOADING_STAGES = [
    ["Scoring the 10-step checklist", "Majority-voted across up to 3 calls"],
    ["Checking grammar and clarity", "One rewrite pass over the whole draft"],
    ["Verifying nothing technical changed", "Dosages, chemical names, timing, conditions"],
    ["Almost there", "Assembling the response"]
  ];

  var $ = function(id){ return document.getElementById(id); };
  var el = function(tag, cls, html){ var e = document.createElement(tag); if(cls) e.className = cls; if(html !== undefined) e.innerHTML = html; return e; };
  var esc = function(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); };

  function loadBaseUrl(){
    try {
      var saved = localStorage.getItem("wa_demo_base_url");
      if (saved) $("baseUrl").value = saved;
    } catch(e) {}
  }
  function saveBaseUrl(){
    try { localStorage.setItem("wa_demo_base_url", $("baseUrl").value.trim()); } catch(e) {}
  }
  function getBase(){
    return $("baseUrl").value.trim().replace(/\/$/, "");
  }

  (function buildStepsGrid(){
    var grid = $("skipStepsGrid");
    FIXED_STEPS.forEach(function(name, i){
      var row = el("label", "step-chk");
      var input = document.createElement("input");
      input.type = "checkbox";
      input.value = name;
      input.id = "skipstep-" + i;
      row.appendChild(input);
      row.appendChild(document.createTextNode(name));
      grid.appendChild(row);
    });
  })();

  function getSkippedSteps(){
    var out = [];
    FIXED_STEPS.forEach(function(name, i){
      if ($("skipstep-" + i).checked) out.push(name);
    });
    return out;
  }

  function setExample(key){
    var ex = EXAMPLES[key];
    if (!ex) return;
    $("question").value = ex.question;
    $("draft").value = ex.draft;
  }
  setExample("complete");

  document.querySelectorAll("[data-example]").forEach(function(btn){
    btn.addEventListener("click", function(){ setExample(btn.getAttribute("data-example")); });
  });

  async function checkConnection(){
    var dot = $("connDot"), label = $("connLabel");
    dot.className = "dot";
    label.textContent = "checking";
    try {
      var res = await fetch(getBase() + "/health", { method: "GET" });
      if (res.ok) {
        dot.className = "dot ok";
        label.textContent = "connected";
      } else {
        dot.className = "dot bad";
        label.textContent = "HTTP " + res.status;
      }
    } catch(e) {
      dot.className = "dot bad";
      label.textContent = "unreachable";
    }
  }
  $("checkBtn").addEventListener("click", function(){ saveBaseUrl(); checkConnection(); });

  function statusBadge(value){
    var v = String(value || "").toLowerCase();
    return '<span class="badge ' + esc(v) + '">' + esc(value) + '</span>';
  }

  function renderStructural(sv){
    var box = el("div", "card accent-structure");
    box.appendChild(el("div", "panel-title", '<h2>Structural validation</h2>' + statusBadge(sv.status)));
    if (sv.status === "skipped" || !sv.steps || !sv.steps.length) {
      box.appendChild(el("div", "reason-box", "Not run for this request."));
      return box;
    }
    var table = el("table", "steps");
    var thead = el("thead", "", "<tr><th>#</th><th>Step</th><th>Coverage</th><th>Gap</th></tr>");
    table.appendChild(thead);
    var tbody = el("tbody");
    sv.steps.forEach(function(s){
      var tr = el("tr");
      tr.appendChild(el("td", "sl", esc(s.slNo)));
      tr.appendChild(el("td", "step-name", esc(s.step)));
      tr.appendChild(el("td", "", statusBadge(s.coverage)));
      var gapCell = el("td");
      if (s.coverage !== "covered") {
        var note = el("div", "gap-note", esc(s.suggestion1 || s.example || ""));
        gapCell.appendChild(note);
      } else {
        gapCell.innerHTML = '<span style="color:var(--ink-faint)">—</span>';
      }
      tr.appendChild(gapCell);
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    box.appendChild(table);
    if (sv.orderWarnings && sv.orderWarnings.length) {
      sv.orderWarnings.forEach(function(w){
        box.appendChild(el("div", "order-warn", esc(w)));
      });
    }
    return box;
  }

  function renderPolishing(lp){
    var box = el("div", "card accent-polish");
    box.appendChild(el("div", "panel-title", '<h2>Language polishing</h2>' + statusBadge(lp.status)));
    if (lp.reason) {
      box.appendChild(el("div", "reason-box", esc(lp.reason)));
    }
    if (lp.status === "suggested" && lp.changes) {
      if (lp.changes.length === 0) {
        box.appendChild(el("div", "reason-box", "No change was needed - returned as-is."));
      } else {
        box.appendChild(el("h3", "", '<span style="font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-dim)">Changes made (' + lp.changes.length + ')</span>'));
        var changesWrap = el("div", "");
        changesWrap.style.marginTop = "8px";
        lp.changes.forEach(function(c){
          var card = el("div", "diff-card");
          card.appendChild(el("div", "diff-row before", '<span class="diff-tag">before</span>' + esc(c.before)));
          card.appendChild(el("div", "diff-row after", '<span class="diff-tag">after</span>' + esc(c.after)));
          changesWrap.appendChild(card);
        });
        box.appendChild(changesWrap);
      }
      var details = el("details", "opts");
      details.appendChild(el("summary", "", "Full suggested text"));
      var body = el("div", "opts-body");
      body.appendChild(el("div", "suggested-text", esc(lp.suggestedText || "")));
      details.appendChild(body);
      box.appendChild(details);
    }
    if (lp.guardrail) {
      var g = lp.guardrail;
      var gbox = el("div", "");
      gbox.style.marginTop = "16px";
      gbox.appendChild(el("div", "panel-title", '<h3>Technical-content guardrail</h3>' + statusBadge(g.status)));
      var grid = el("div", "tokens-grid");
      var labels = {
        numbersAndUnits: "Numbers & units", chemicalNames: "Chemical names", certaintyLanguage: "Certainty",
        negation: "Negation", cropNames: "Crop names", treatmentIdentity: "Treatment identity",
        timing: "Timing", conditions: "Conditions", sentenceAlignment: "Sentence alignment"
      };
      Object.keys(labels).forEach(function(k){
        var val = g.checkedTokens ? g.checkedTokens[k] : null;
        if (val == null) return;
        var chip = el("div", "token-chip");
        chip.appendChild(el("span", "tname", labels[k]));
        chip.appendChild(el("span", "tval " + val, val));
        grid.appendChild(chip);
      });
      gbox.appendChild(grid);
      if (g.details && g.details.length) {
        var ul = el("ul", "details-list");
        g.details.forEach(function(d){ ul.appendChild(el("li", "", esc(d))); });
        gbox.appendChild(ul);
      }
      if (g.disclaimer) gbox.appendChild(el("div", "disclaimer", esc(g.disclaimer)));
      box.appendChild(gbox);
    }
    return box;
  }

  function renderMeta(data, elapsedMs){
    var row = el("div", "meta-row");
    row.appendChild(el("span", "chip2", "request " + esc((data.requestId || "").slice(0, 8))));
    row.appendChild(el("span", "chip2", (elapsedMs / 1000).toFixed(1) + "s"));
    if (data.warnings && data.warnings.length) row.appendChild(el("span", "chip2", data.warnings.length + " warning(s)"));
    if (data.errors && data.errors.length) row.appendChild(el("span", "chip2", data.errors.length + " error(s)"));
    return row;
  }

  function renderRaw(data){
    var details = el("details", "opts");
    details.appendChild(el("summary", "", "Raw response JSON"));
    var body = el("div", "opts-body");
    body.appendChild(el("pre", "raw", esc(JSON.stringify(data, null, 2))));
    details.appendChild(body);
    return details;
  }

  function renderError(message, hint){
    var box = el("div", "err-box");
    box.innerHTML = "<strong>Request failed</strong>" + esc(message) +
      (hint ? '<div style="margin-top:6px"><code>' + esc(hint) + "</code></div>" : "");
    return box;
  }

  var stageTimer = null;
  function startLoadingCard(pane){
    pane.innerHTML = "";
    var card = el("div", "loading-card");
    card.appendChild(el("div", "loading-bar"));
    card.appendChild(el("div", "stage", LOADING_STAGES[0][0]));
    card.appendChild(el("div", "stage-sub", LOADING_STAGES[0][1]));
    pane.appendChild(card);
    var i = 0;
    var stageEl = card.querySelector(".stage");
    var subEl = card.querySelector(".stage-sub");
    stageTimer = setInterval(function(){
      i = (i + 1) % LOADING_STAGES.length;
      stageEl.style.opacity = 0;
      subEl.style.opacity = 0;
      setTimeout(function(){
        stageEl.textContent = LOADING_STAGES[i][0];
        subEl.textContent = LOADING_STAGES[i][1];
        stageEl.style.opacity = 1;
        subEl.style.opacity = 1;
      }, 250);
    }, 4500);
  }
  function stopLoadingCard(){
    if (stageTimer) { clearInterval(stageTimer); stageTimer = null; }
  }

  async function runRequest(){
    var base = getBase();
    saveBaseUrl();
    var pane = $("resultsPane");
    startLoadingCard(pane);

    var payload = {
      question: $("question").value,
      draft: $("draft").value,
      skipSteps: getSkippedSteps(),
      skipStructuralValidation: $("skipStructural").checked,
      skipGuardrail: $("skipGuardrail").checked,
      skipPolish: $("skipPolish").checked
    };

    var btn = $("submitBtn");
    btn.disabled = true;
    btn.textContent = "Running…";
    var t0 = performance.now();
    try {
      var res = await fetch(base + "/polish-draft", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      var elapsed = performance.now() - t0;
      stopLoadingCard();
      if (!res.ok) {
        var text = await res.text();
        pane.innerHTML = "";
        pane.appendChild(renderError("HTTP " + res.status, text.slice(0, 400)));
        return;
      }
      var data = await res.json();
      pane.innerHTML = "";
      var results = el("div", "results");
      results.appendChild(renderMeta(data, elapsed));
      results.appendChild(renderStructural(data.structuralValidation || {}));
      results.appendChild(renderPolishing(data.languagePolishing || {}));
      results.appendChild(renderRaw(data));
      pane.appendChild(results);
    } catch(e) {
      stopLoadingCard();
      pane.innerHTML = "";
      pane.appendChild(renderError(
        "Could not reach the server.",
        "Check the endpoint field and that the server is running."
      ));
    } finally {
      btn.disabled = false;
      btn.textContent = "Run /polish-draft";
    }
  }
  $("submitBtn").addEventListener("click", runRequest);

  loadBaseUrl();
  checkConnection();
})();
</script>
</body>
</html>
